<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado | Aeronáutica Simulados</title>

    <!-- Google Fonts: Poppins para Títulos, Inter para Textos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS + Configuração Compartilhada -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>

    <!-- Tema Compartilhado -->
    <link rel="stylesheet" href="./css/theme.css">
</head>
<body class="font-inter antialiased relative min-h-screen flex flex-col">

    <!-- BACKGROUND DINÂMICO DE NAVEGAÇÃO AÉREA -->
    <svg class="nav-chart chart-vor" viewBox="0 0 200 200" fill="none" stroke="currentColor">
        <circle cx="100" cy="100" r="80" stroke-width="1.5" stroke-dasharray="4 8" />
        <circle cx="100" cy="100" r="60" stroke-width="0.5" />
        <path d="M100 5 L100 195 M5 100 L195 100" stroke-width="1" stroke-dasharray="10 5" />
        <polygon points="95,20 105,20 100,5" fill="currentColor" />
        <text x="110" y="100" font-family="monospace" font-size="12" font-weight="bold" fill="currentColor">VCP</text>
        <circle cx="100" cy="100" r="3" fill="currentColor" />
    </svg>
    <svg class="nav-chart chart-runway" viewBox="0 0 150 150" fill="none" stroke="currentColor">
        <rect x="60" y="20" width="30" height="110" rx="2" stroke-width="1.5" />
        <path d="M75 25 L75 125" stroke-width="1" stroke-dasharray="6 6" />
        <text x="20" y="45" font-family="monospace" font-size="10" fill="currentColor">ILS 109.30</text>
    </svg>

    <!-- Blobs (Luzes de Fundo) -->
    <div class="blob bg-primary/40 w-96 h-96 top-[-10%] left-[-10%]"></div>
    <div class="blob bg-secondary/40 w-80 h-80 top-[30%] right-[-5%]"></div>

    <!-- Navegação Padronizada -->
    <header id="app-navbar" data-page="simulado" class="relative z-50"></header>

    <!-- Estado de Carregamento -->
    <div id="simulado-loading" class="relative z-10 flex-1 flex items-center justify-center px-6 pt-28 pb-16">
        <div class="glass-dark rounded-[2rem] p-8 shadow-glass border border-white/60 bg-white/60 backdrop-blur-xl text-center space-y-3 max-w-md w-full">
            <i class="ph-bold ph-compass text-4xl text-primary animate-spin"></i>
            <p class="font-poppins font-semibold text-carbon">Carregando simulado...</p>
        </div>
    </div>

    <!-- Estado de Erro -->
    <div id="simulado-erro" class="hidden relative z-10 flex-1 flex items-center justify-center px-6 pt-28 pb-16">
        <div class="glass-dark rounded-[2rem] p-8 shadow-glass border border-white/60 bg-white/70 backdrop-blur-xl text-center space-y-4 max-w-md w-full">
            <i class="ph-fill ph-warning-circle text-4xl text-red-500"></i>
            <h1 class="font-poppins font-bold text-xl text-carbon">Não foi possível abrir o simulado</h1>
            <p id="simulado-erro-msg" class="text-sm text-carbon/75"></p>
            <a href="./dashboard.html" class="inline-flex items-center gap-2 bg-primary text-white px-6 py-3 rounded-xl font-poppins font-semibold text-sm hover:bg-primary/90 transition-colors">
                <i class="ph-bold ph-arrow-left"></i> Voltar ao Dashboard
            </a>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <main id="simulado-main" class="hidden relative z-10 flex-1 max-w-5xl w-full mx-auto px-6 pt-24 pb-16 space-y-6">

        <!-- Barra de Status da Prova (Cronômetro + Progresso) -->
        <div id="exam-hud-bar" class="hidden sticky top-[76px] z-30 glass rounded-2xl px-4 sm:px-6 py-3 shadow-sm border border-white/60 flex flex-wrap items-center justify-between gap-3">
            <span id="progress-badge" class="text-xs sm:text-sm font-semibold text-primary px-3.5 py-1.5 bg-primary/10 rounded-full">
                Questão 1 de 20
            </span>
            <div id="timer-box" class="flex items-center gap-2 px-4 py-1.5 rounded-full glass-dark border border-primary/20 text-carbon font-poppins font-bold text-sm">
                <i class="ph-fill ph-timer text-accent text-lg"></i>
                <span id="timer-display">30:00</span>
            </div>
        </div>

        <!-- Aviso opcional (ex.: categoria com menos de 20 questões ou tempo esgotado) -->
        <div id="simulado-aviso" class="hidden px-4 py-3 rounded-2xl border bg-amber-50 border-amber-200 text-amber-800 text-sm font-medium flex items-center gap-2.5"></div>

        <!-- MODO EXECUÇÃO (EM_ANDAMENTO) -->
        <div id="modo-execucao" class="hidden space-y-6">

            <!-- Card Principal da Questão (espelhando o card do Hero da landing page) -->
            <section class="relative glass-dark rounded-[2rem] p-6 sm:p-10 shadow-glass border border-white/60 bg-white/55 backdrop-blur-xl">
                <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                    <div class="flex items-center gap-2.5">
                        <div class="hidden sm:flex gap-1.5 mr-1">
                            <div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
                        </div>
                        <span id="simulado-banca" class="text-xs font-semibold text-primary px-3.5 py-1 bg-primary/10 rounded-full">
                            Simulado
                        </span>
                    </div>

                    <!-- Barra de Progresso (respondidas) -->
                    <div class="flex items-center gap-3 w-full sm:w-56">
                        <div class="h-2 w-full bg-carbon/10 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-accent w-0 rounded-full transition-all duration-300"></div>
                        </div>
                        <span id="progress-percent" class="text-xs font-bold text-accent whitespace-nowrap">0%</span>
                    </div>
                </div>

                <h1 id="questao-enunciado" class="font-poppins font-semibold text-lg sm:text-2xl text-carbon leading-relaxed mb-4"></h1>

                <div id="questao-enunciado-imagem" class="hidden mb-6"></div>

                <div id="alternativas-lista" class="space-y-3"></div>

                <!-- Controles de Navegação -->
                <div class="mt-8 pt-6 border-t border-carbon/10 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex gap-3">
                        <button id="btn-anterior" type="button" class="glass px-5 py-3 rounded-xl font-poppins font-semibold text-sm text-carbon hover:bg-white transition-all flex items-center gap-2 disabled:opacity-45 disabled:cursor-not-allowed">
                            <i class="ph-bold ph-caret-left"></i> Anterior
                        </button>
                        <button id="btn-proxima" type="button" class="bg-primary text-white px-6 py-3 rounded-xl font-poppins font-semibold text-sm shadow-md shadow-primary/25 hover:bg-primary/90 transition-all flex items-center gap-2 disabled:opacity-45 disabled:cursor-not-allowed">
                            Próxima <i class="ph-bold ph-caret-right"></i>
                        </button>
                    </div>

                    <button id="btn-finalizar" type="button" class="bg-accent text-white px-7 py-3 rounded-xl font-poppins font-semibold text-sm shadow-lg shadow-accent/30 hover:shadow-glow hover:-translate-y-0.5 transition-all flex items-center gap-2">
                        <i class="ph-bold ph-check-circle text-lg"></i>
                        <span id="btn-finalizar-label">Finalizar e Corrigir</span>
                    </button>
                </div>
            </section>

            <!-- Navegador Livre entre Questões -->
            <section class="glass rounded-[2rem] p-6 shadow-glass border border-white/60 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-carbon/70">
                    <span class="font-poppins font-semibold text-carbon">Navegação Rápida</span>
                    <span id="respondidas-resumo">0 de 0 respondidas</span>
                </div>
                <div id="questoes-nav" class="flex flex-wrap gap-2"></div>
            </section>

        </div>

        <!-- MODO RESULTADO E GABARITO COMENTADO (FINALIZADO) -->
        <section id="modo-resultado" class="hidden space-y-8">
            <!-- Resumo do Resultado -->
            <div class="glass-dark rounded-[2rem] p-8 shadow-glass border border-white/60 bg-white/60 backdrop-blur-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div class="space-y-2">
                    <div class="flex flex-wrap items-center gap-2">
                        <span id="resultado-categoria" class="px-3.5 py-1 rounded-full bg-primary/10 text-primary text-xs font-poppins font-semibold"></span>
                        <span id="resultado-status-badge" class="px-3.5 py-1 rounded-full text-xs font-poppins font-bold"></span>
                    </div>
                    <h1 id="resultado-titulo" class="font-poppins font-extrabold text-3xl text-carbon">Resultado do Simulado</h1>
                    <p id="resultado-subtitulo" class="text-sm text-carbon/75"></p>
                </div>

                <div class="flex items-center gap-6">
                    <div class="text-center">
                        <div id="resultado-percentual" class="font-poppins font-extrabold text-4xl text-primary">0%</div>
                        <div id="resultado-acertos" class="text-xs font-medium text-carbon/70 mt-1">0 de 0 acertos</div>
                    </div>
                    <a href="./dashboard.html" class="bg-accent text-white px-6 py-3.5 rounded-2xl font-poppins font-semibold text-sm shadow-lg shadow-accent/30 hover:shadow-glow hover:-translate-y-0.5 transition-all inline-flex items-center gap-2 whitespace-nowrap">
                        <i class="ph-bold ph-arrow-clockwise text-base"></i> Novo Simulado
                    </a>
                </div>
            </div>

            <!-- Lista Completa de Revisão Comentada -->
            <div class="bg-white rounded-[2rem] p-6 sm:p-8 shadow-glass border border-gray-100 space-y-6">
                <div class="flex items-center gap-3 border-b border-gray-100 pb-5">
                    <div class="w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center text-2xl">
                        <i class="ph-fill ph-seal-check"></i>
                    </div>
                    <div>
                        <h2 class="font-poppins font-bold text-2xl text-carbon">Gabarito Comentado</h2>
                        <p class="text-sm text-carbon/70">Compare sua marcação com o gabarito oficial e revise cada explicação.</p>
                    </div>
                </div>

                <div id="gabarito-detalhes" class="space-y-5"></div>
            </div>
        </section>

    </main>

    <!-- Modal de Zoom (Lightbox) para Imagens de Cartas e Instrumentos -->
    <div id="image-lightbox" role="dialog" aria-modal="true" aria-label="Visualização ampliada da imagem" class="hidden fixed inset-0 z-[100] bg-carbon/80 backdrop-blur-md items-center justify-center p-4 sm:p-8">
        <div id="lightbox-dialog" class="relative max-w-5xl w-full max-h-[92vh] glass rounded-[2rem] p-4 sm:p-6 shadow-glass border border-white/50 flex flex-col items-center gap-3">
            <button id="lightbox-close" type="button" aria-label="Fechar visualização ampliada" class="absolute -top-3 -right-3 w-10 h-10 rounded-full bg-carbon text-white hover:bg-accent shadow-lg transition-colors flex items-center justify-center">
                <i class="ph-bold ph-x text-lg"></i>
            </button>
            <img id="lightbox-img" alt="Imagem ampliada" class="max-h-[78vh] w-auto max-w-full object-contain rounded-xl bg-white">
            <p id="lightbox-caption" class="text-xs sm:text-sm font-medium text-carbon/80 text-center"></p>
        </div>
    </div>

    <!-- Rodapé Padronizado -->
    <footer id="app-footer"></footer>

    <script type="module" src="./js/navbar.js"></script>
    <script type="module" src="./js/footer.js"></script>
    <script type="module" src="./js/simulado.js"></script>
</body>
</html>
